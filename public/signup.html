<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Create your SnippetVault account — start saving code snippets." />
  <title>Sign Up — SnippetVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <!-- Brand -->
      <div class="auth-header">
        <div class="brand-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <defs><linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs>
            <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
          </svg>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Start saving your code snippets in the cloud</p>
      </div>

      <!-- Error message -->
      <div id="auth-error" class="auth-error hidden"></div>

      <!-- Signup form -->
      <form id="signup-form">
        <label class="auth-field">
          <span class="field-label">Username</span>
          <input id="auth-username" type="text" placeholder="Choose a username" required />
        </label>

        <label class="auth-field">
          <span class="field-label">Email</span>
          <input id="auth-email" type="email" placeholder="you@example.com" required />
        </label>

        <label class="auth-field">
          <span class="field-label">Password</span>
          <input id="auth-password" type="password" placeholder="At least 6 characters" required />
        </label>

        <label class="auth-field">
          <span class="field-label">Confirm Password</span>
          <input id="auth-confirm" type="password" placeholder="Re-enter your password" required />
        </label>

        <button type="submit" class="auth-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          Create Account
        </button>
      </form>

      <p class="auth-link">
        Already have an account? <a href="/login.html">Log in</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
